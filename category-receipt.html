
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শ্রী শ্রী জগন্নাথ সেবাসঙ্গন - সেবা ও উপকরণ রসিদ</title>
    <style>
        body {
            background-color: #f4f4f9;
            font-family: 'SolaimanLipi', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .invoice-box {
            width: 100%;
            max-width: 700px;
            background: #fff;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            border-top: 5px solid #652b0d;
            position: relative;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            color: #652b0d;
            font-size: 24px;
        }
        .header p {
            margin: 5px 0 0;
            color: #555;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn {
            background-color: #652b0d;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #4a1f09;
        }
    </style>
</head>
<body>

<div class="invoice-box">
    <div class="header">
        <h2>শ্রী শ্রী জগন্নাথ সেবাসঙ্গন</h2>
        <p>সেবা ও উপকরণ রসিদ ফরম</p>
    </div>

    <div class="form-group">
        <label for="donorName">ভক্ত/দাতার নাম:</label>
        <input type="text" id="donorName" placeholder="নাম লিখুন">
    </div>

    <div class="form-group">
        <label for="categoryType">খাত বা ক্যাটাগরি:</label>
        <select id="categoryType">
            <option value="seva">সেবা দান</option>
            <option value="upokoron">উপকরণ সংগ্রহ</option>
            <option value="annadan">অন্নদান সেবা</option>
            <option value="general">সাধারণ দান</option>
        </select>
    </div>

    <div class="form-group">
        <label for="amount">টাকার পরিমাণ (৳):</label>
        <input type="number" id="amount" placeholder="পরিমাণ লিখুন">
    </div>

    <button class="btn" onclick="alert('রসিদ সফলভাবে সংরক্ষণ করা হয়েছে!')">রসিদ তৈরি করুন</button>
</div>

<!-- শ্রী শ্রী জগন্নাথ সেবাঙ্গন অনলাইন আবেদন সেকশন -->
<section id="event-booking-section" class="py-12 px-4 sm:px-6 max-w-4xl mx-auto w-full">
    <div class="bg-white p-6 sm:p-10 rounded-2xl shadow-xl border border-amber-200">
        <h2 class="text-2xl sm:text-3xl font-bold text-amber-900 text-center mb-2">
            🙏 শ্রী শ্রী জগন্নাথ সেবাঙ্গন - অনলাইন অনুষ্ঠান ও প্রসাদ আবেদন
        </h2>
        <p class="text-amber-800 text-center text-sm sm:text-base mb-8">
            মন্দিরে অনুষ্ঠান আয়োজন, কয়েকজন ভক্তের প্রসাদ সেবা অথবা প্রসাদের বাটা সংগ্রহের জন্য নিচের ফরমটি পূরণ করুন।
        </p>

        <form id="bookingForm" class="space-y-6">
            <!-- ভক্তের সাধারণ তথ্য -->
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">ভক্তের নাম *</label>
                    <input type="text" required placeholder="আপনার নাম লিখুন" class="w-full px-4 py-2.5 rounded-lg border border-amber-300 focus:ring-2 focus:ring-amber-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">মোবাইল নম্বর *</label>
                    <input type="tel" required placeholder="018XXXXXXXX" class="w-full px-4 py-2.5 rounded-lg border border-amber-300 focus:ring-2 focus:ring-amber-600 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">পূর্ণ ঠিকানা *</label>
                <textarea rows="2" required placeholder="গ্রাম/ইউনিয়ন, সেনবাগ, নোয়াখালী" class="w-full px-4 py-2.5 rounded-lg border border-amber-300 focus:ring-2 focus:ring-amber-600 focus:outline-none"></textarea>
            </div>

            <!-- আবেদনের ধরন -->
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">আবেদনের ধরন / সুযোগ *</label>
                    <select required class="w-full px-4 py-2.5 rounded-lg border border-amber-300 focus:ring-2 focus:ring-amber-600 focus:outline-none">
                        <option value="">নির্বাচন করুন...</option>
                        <option value="মন্দিরে পূর্ণ অনুষ্ঠান/মহোৎসব">১. মন্দিরে পূর্ণ অনুষ্ঠান / মহোৎসব আয়োজন</option>
                        <option value="কয়েক জনের প্রসাদ সেবা">২. কয়েকজন ভক্তের সাধারণ প্রসাদ সেবা</option>
                        <option value="মন্দির থেকে প্রসাদের বাটা সংগ্রহ">৩. মন্দির থেকে প্রসাদের বাটা সংগ্রহ</option>
                        <option value="বিশেষ সেবা/অন্যান্য">৪. বিশেষ সেবা / পূজা নিবেদন</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">অনুষ্ঠানের তারিখ *</label>
                    <input type="date" required class="w-full px-4 py-2.5 rounded-lg border border-amber-300 focus:ring-2 focus:ring-amber-600 focus:outline-none">
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">সময় / বেলা *</label>
                    <select required class="w-full px-4 py-2.5 rounded-lg border border-amber-300 focus:ring-2 focus:ring-amber-600 focus:outline-none">
                        <option value="আগের দিন রাতে">আগের দিন রাতে</option>
                        <option value="সকালে বাল্য ভোগ">সকালে বাল্য ভোগ</option>
                        <option value="দুপুরে রাজভোগ">দুপুরে রাজভোগ</option>
                        <option value="সন্ধ্যায় আরতি/ভোগ">সন্ধ্যায় আরতি / ভোগ</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">আনুমানিক ভক্ত / বাটা সংখ্যা *</label>
                    <input type="number" required placeholder="যেমন: ৫০ জন বা ৫ বাটা" class="w-full px-4 py-2.5 rounded-lg border border-amber-300 focus:ring-2 focus:ring-amber-600 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">কাঙ্ক্ষিত প্রসাদী মেন্যু / বিশেষ অনুরোধ</label>
                <textarea rows="3" placeholder="যেমন: খিচুড়ি, ডাল, আলুর দম, পায়েস বা অন্নপ্রাশনের বাটা প্রসাদ" class="w-full px-4 py-2.5 rounded-lg border border-amber-300 focus:ring-2 focus:ring-amber-600 focus:outline-none"></textarea>
            </div>

            <button type="submit" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-300 text-lg">
                🙏 আবেদন জমা দিন (Submit Application)
            </button>
        </form>
    </div>
</section>
    
</body>
</html>
