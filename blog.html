<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ব্লগ ও স্মৃতি স্মারক - শ্রী শ্রী জগন্নাথ সেবাঙ্গন</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tiro Bangla', serif;
      background-color: #FAF6EE;
      color: #3E2723;
    }
  </style>
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 lg:px-8">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <header class="text-center mb-12 border-b-2 border-amber-200 pb-6">
      <h1 class="text-3xl sm:text-4xl font-bold text-amber-900 mb-2">শ্রী শ্রী জগন্নাথ সেবাঙ্গন ও রাধাকৃষ্ণ গৌর নিত্যানন্দ প্রেম সেবাকুঞ্জ</h1>
      <p class="text-lg text-amber-800">উত্তর সাহাপুর, সেনবাগ, নোয়াখালী, বাংলাদেশ</p>
    </header>

    <!-- Blog Posts Container -->
    <main id="blog-posts" class="space-y-12">
      <!-- Posts will load dynamically -->
      <p class="text-center text-gray-500 py-10">ব্লগ পোস্টসমূহ লোড হচ্ছে...</p>
    </main>
  </div>

  <script>
    // Fetch and render markdown blog posts from CMS
    async function fetchPosts() {
      const container = document.getElementById('blog-posts');
      try {
        // Fetch files from GitHub/CMS content folder or API
        const response = await fetch('/content/blog/');
        if (!response.ok) throw new Error('Network response error');
        // Fallback rendering structure for static pages
      } catch (err) {
        console.log("Loading static or CMS content...");
      }
    }
    fetchPosts();
  </script>
</body>
</html>
