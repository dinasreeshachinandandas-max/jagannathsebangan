<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সংবাদ ও বার্তা - শ্রী শ্রী জগন্নাথ সেবাঙ্গন</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; background-color: #FAF6EE; color: #3E2723; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Header / Navbar -->
  <header class="bg-amber-900 text-amber-100 py-4 px-6 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">শ্রী শ্রী জগন্নাথ সেবাঙ্গন</h1>
      <a href="/" class="text-sm bg-amber-800 hover:bg-amber-700 px-3 py-1.5 rounded transition">← মূল ওয়েবসাইট</a>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full">
    <div id="posts-container" class="space-y-8">
      <p class="text-center text-gray-600 py-10">ব্লগ পোস্টসমূহ লোড হচ্ছে...</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-amber-950 text-amber-200/80 text-center py-4 text-sm mt-12">
    <p>© শ্রী শ্রী জগন্নাথ সেবাঙ্গন ও রাধাকৃষ্ণ গৌর নিত্যানন্দ মন্দির</p>
  </footer>

  <script>
    // Frontmatter & Markdown Parser for Decap CMS
    function parseMarkdown(text) {
      const parts = text.split(/---/);
      if (parts.length < 3) return { meta: {}, content: text };
      
      const rawMeta = parts[1].trim().split('\n');
      const meta = {};
      
      rawMeta.forEach(line => {
        const [key, ...valueParts] = line.split(':');
        if (key && valueParts.length) {
          meta[key.trim()] = valueParts.join(':').trim().replace(/^['"]|['"]$/g, '');
        }
      });

      return { meta, content: parts.slice(2).join('---').trim() };
    }

    async function loadCMSPosts() {
      const container = document.getElementById('posts-container');
      try {
        // GitHub API call to fetch files from content/blog directory
        const response = await fetch('https://api.github.com/repos/dinasreeshachinandandas-max/jagannathsebangan/contents/content/blog');
        if (!response.ok) throw new Error('Posts folder not found');
        
        const files = await response.json();
        const mdFiles = files.filter(file => file.name.endsWith('.md'));

        if (mdFiles.length === 0) {
          container.innerHTML = '<p class="text-center text-gray-600">কোনো পোস্ট পাওয়া যায়নি।</p>';
          return;
        }

        container.innerHTML = ''; // Clear loading text

        for (const file of mdFiles) {
          const res = await fetch(file.download_url);
          const rawText = await res.text();
          const { meta, content } = parseMarkdown(rawText);
          const htmlBody = marked.parse(content);

          const postElement = document.createElement('article');
          postElement.className = 'bg-white rounded-2xl shadow-md p-6 border border-amber-200/60';
          
          let imageHTML = '';
          if (meta.image) {
            imageHTML = `<div class="my-4"><img src="${meta.image}" alt="${meta.title || ''}" class="w-full max-h-96 object-cover rounded-xl shadow-sm"></div>`;
          }

          postElement.innerHTML = `
            <h2 class="text-2xl sm:text-3xl font-bold text-amber-900 mb-3">${meta.title || 'শিরোনামহীন'}</h2>
            ${imageHTML}
            <div class="prose max-w-none text-gray-800 leading-relaxed text-base sm:text-lg">
              ${htmlBody}
            </div>
          `;
          
          container.appendChild(postElement);
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="text-center text-red-600">পোস্টসমূহ লোড করতে সমস্যা হয়েছে। অনুগ্রহ করে পেজটি রিফ্রেশ করুন।</p>';
      }
    }

    loadCMSPosts();
  </script>
</body>
</html>
