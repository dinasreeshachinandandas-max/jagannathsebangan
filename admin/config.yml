backend:
  name: github
  repo: dinasrees/jagannathsebangan
​branch: main
base_url: https://jagannathsebangan.netlify.app
auth_type: implicit
client_id: 0v23liP0udCmJu8AfZuE


media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}
